<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR-код · Атмо Вирья</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #f8f8f5;
      padding: 2rem;
    }
    h1 { font-size: 1.25rem; color: #2c2c2c; margin-bottom: 1rem; }
    #qr { padding: 16px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    a { font-size: 0.9rem; color: #7c3aed; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Сканируйте для перехода на сайт</h1>
  <canvas id="qr"></canvas>
  <a href="https://portfolio-glyfas-projects.vercel.app" target="_blank">portfolio-glyfas-projects.vercel.app</a>
  <button onclick="download()" style="margin-top:1rem;padding:0.6rem 1.2rem;background:#7c3aed;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:0.9rem">Сохранить QR как PNG</button>
  <script>
    var url = 'https://portfolio-glyfas-projects.vercel.app';
    QRCode.toCanvas(document.getElementById('qr'), url, {
      width: 280,
      margin: 2,
      color: { dark: '#1e293b', light: '#ffffff' }
    });
    function download() {
      var a = document.createElement('a');
      a.download = 'qr-atmo-virya.png';
      a.href = document.getElementById('qr').toDataURL('image/png');
      a.click();
    }
  </script>
</body>
</html>
